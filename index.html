<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finanzas Personal y Empresa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4F6;--sf:#FFFFFF;--sf2:#F6F8FA;--ink:#16202E;--mut:#66727F;--line:#E2E6EB;
  --pos:#0E8A5F;--neg:#C43D2C;--warn:#A85F00;
  --pc:#2450D6;--bc:#0C6B58;--pct:#2450D6;--bct:#0C6B58;--scrim:rgba(14,19,26,.45);
  color-scheme:light dark;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E131A;--sf:#171E28;--sf2:#1D2632;--ink:#EAEFF5;--mut:#93A0B2;--line:#283344;
    --pos:#3CCB93;--neg:#FF7B69;--warn:#F2A93B;
    --pc:#3D63E8;--bc:#12876F;--pct:#8FA8FF;--bct:#4FD1B3;--scrim:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0E131A;--sf:#171E28;--sf2:#1D2632;--ink:#EAEFF5;--mut:#93A0B2;--line:#283344;
  --pos:#3CCB93;--neg:#FF7B69;--warn:#F2A93B;
  --pc:#3D63E8;--bc:#12876F;--pct:#8FA8FF;--bct:#4FD1B3;--scrim:rgba(0,0,0,.6);
}
body[data-acc="personal"]{--acc:var(--pc);--accT:var(--pct)}
body[data-acc="business"]{--acc:var(--bc);--accT:var(--bct)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;--acc:var(--pc);--accT:var(--pct)}
body.lock{overflow:hidden}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--accT);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;padding:0 16px 150px}
.num,.big,.sh-h h2,.hsplit b,.stat b,.pg-h h1{font-family:'Bricolage Grotesque','Instrument Sans',system-ui,sans-serif;font-variant-numeric:tabular-nums}

/* Cabecera */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:6px;margin:0 -16px;padding:12px 16px 10px}
.seg{flex:1;display:flex;background:var(--sf);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{flex:1;padding:9px 6px;border-radius:999px;font-weight:600;color:var(--mut);display:flex;gap:6px;align-items:center;justify-content:center;text-align:center}
.seg button.on{background:var(--acc);color:#fff}
.seg button.lockd{opacity:.55}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink);flex:none}
.ib:hover{background:var(--sf)}

/* Tarjetas */
.card{background:var(--sf);border:1px solid var(--line);border-radius:18px;padding:16px;margin:0 0 12px}
.card h3{margin:0 0 10px;font-size:15px;font-weight:600}
.card p{margin:0 0 10px;color:var(--mut)}
.hero{background:var(--acc);color:#fff;border-radius:22px;padding:20px;margin:0 0 12px}
.hero small{opacity:.82;font-size:13px}
.big{font-size:38px;line-height:1.1;font-weight:700;letter-spacing:-.02em;margin:4px 0 14px}
.hsplit{display:flex;gap:10px}
.hsplit>div{flex:1;background:rgba(255,255,255,.15);border-radius:14px;padding:10px 12px;min-width:0}
.hsplit b{display:block;font-size:17px;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}
.stat small{color:var(--mut);display:block}
.stat b{display:block;font-size:20px;font-weight:700;margin-top:2px;overflow-wrap:anywhere}
.pos{color:var(--pos)}.neg{color:var(--neg)}.warn{color:var(--warn)}.neu{color:var(--mut)}
.mnav{display:flex;align-items:center;justify-content:space-between;margin:0 0 8px}
.mnav b{font-weight:600}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--sf2);border:1px solid var(--line);color:var(--mut)}
.tag.pos{color:var(--pos)}.tag.warn{color:var(--warn)}.tag.neg{color:var(--neg)}

/* Listas */
.list .item:first-of-type{border-top:0}
.item{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);width:100%}
button.item,div.item[data-a]{cursor:pointer}
.grow{flex:1;min-width:0}
.grow>*{display:block}
.grow small,.rt small{color:var(--mut);font-size:13px}
.grow small.warn,.rt small.warn{color:var(--warn)}
.grow small.pos,.rt small.pos{color:var(--pos)}
.clip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt{text-align:right;flex:none;max-width:52%}
.rt>*{display:block}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.amt{font-weight:600;flex:none}
.item .num{font-weight:600}

/* Barras y gráficos */
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--accT);border-radius:99px}
.bar.over i{background:var(--neg)}
.dn{display:flex;gap:14px;align-items:center}
.donut{width:132px;height:132px;flex:none}
.donut .dl{font-size:9px;fill:var(--mut)}
.donut .dv{font-size:15px;font-weight:700;fill:var(--ink)}
.lg{list-style:none;margin:0;padding:0;flex:1;min-width:0}
.lg li{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:14px}
.lg li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg i{width:9px;height:9px;border-radius:50%;flex:none}
.bars{width:100%;height:auto}
.bars text{font-size:9px;fill:var(--mut);text-anchor:middle}
.bars .b1{fill:var(--accT);opacity:.35}.bars .b2{fill:var(--accT)}
.key{display:flex;gap:14px;font-size:13px;color:var(--mut);margin-top:4px}
.key i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--accT)}
.key i.l{opacity:.35}

/* Botones y campos */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 18px;border-radius:14px;font-weight:600;background:var(--sf2);border:1px solid var(--line);text-align:center}
.btn.primary{background:var(--acc);color:#fff;border-color:transparent;width:100%}
.btn.danger{color:var(--neg);width:100%;margin-top:8px}
.btn.tint{background:transparent;color:var(--accT);border-color:var(--accT)}
.btn.sm{min-height:36px;padding:0 13px;font-size:14px;border-radius:11px}
.btn.block{width:100%;margin-top:4px}
.fld{display:block;margin:0 0 14px}
.fld>span{display:block;font-size:13px;color:var(--mut);margin-bottom:6px}
.fld input:not([type=radio]),.fld select,.fld textarea,.mini input{width:100%;min-height:46px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--sf2)}
.fld textarea{padding:10px 12px;min-height:180px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace}
.fld input.bigin{font:700 28px 'Bricolage Grotesque','Instrument Sans',sans-serif;min-height:60px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-flex;align-items:center;gap:6px;padding:9px 13px;border:1px solid var(--line);border-radius:999px;background:var(--sf2);font-size:14px}
.chip input:checked+span{background:var(--acc);color:#fff;border-color:transparent}
.chip input:focus-visible+span{outline:2px solid var(--accT);outline-offset:2px}
.chip i{width:9px;height:9px;border-radius:50%;flex:none}
.chips.two{flex-wrap:nowrap}
.chips.two .chip{flex:1}
.chips.two .chip span{width:100%;justify-content:center}
.tabs{display:flex;gap:8px;margin:0 0 12px;overflow-x:auto}
.chip2{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--sf);font-size:14px;white-space:nowrap;flex:none}
.chip2.on{background:var(--acc);color:#fff;border-color:transparent}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;margin-bottom:8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.tot b{font-size:22px}
.tot small{display:block;color:var(--mut);font-size:13px;text-align:right}
.ln{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end;margin-bottom:12px;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.ln>select{grid-column:1/-1;width:100%;min-height:46px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--sf2)}
.mini small{display:block;color:var(--mut);font-size:12px;margin-bottom:3px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.kv span{color:var(--mut)}
.kv b{text-align:right;font-weight:600}
.empty{background:var(--sf);border:1px dashed var(--line);border-radius:18px;padding:22px 18px;text-align:center;margin-bottom:12px}
.empty p{margin:4px 0 0;color:var(--mut)}
.hint{border-style:dashed}
.banner{background:var(--sf);border:1px solid var(--warn);color:var(--warn);border-radius:14px;padding:10px 14px;margin-bottom:12px;font-size:14px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;padding:12px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;background:var(--sf2)}
.opt.on{border-color:var(--accT);box-shadow:inset 0 0 0 1px var(--accT)}
.opt b{display:block}.opt small{color:var(--mut)}
.pg-h{display:flex;align-items:center;gap:6px;padding:12px 0 6px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:20;margin:0 -16px;padding-left:12px;padding-right:16px}
.pg-h h1{font-size:22px;margin:0}
h4{margin:18px 0 8px;font-size:14px;color:var(--mut);font-weight:600}
.row2{display:flex;gap:8px}.row2>*{flex:1}

.tr4{display:grid;grid-template-columns:28px 1fr auto 74px;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:center}
.tr4.hd{color:var(--mut);font-size:12px}
.tr4 b{font-weight:600;text-align:right}.tr4 span:last-child{text-align:right}
.btns{display:flex;gap:6px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.bars .bp{fill:var(--pos)}.bars .bn{fill:var(--neg)}
.key i.k-b1{background:var(--accT);opacity:.35}.key i.k-b2{background:var(--accT)}.key i.k-bp{background:var(--pos)}.key i.k-bn{background:var(--neg)}
/* Navegación */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,520px);display:flex;background:var(--sf);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:30}
.nav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;font-size:11px;color:var(--mut);border-radius:12px;text-align:center}
.nav span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav button.on{color:var(--accT);font-weight:600}
.fab{position:fixed;right:max(16px,calc(50% - 244px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:18px;background:var(--acc);color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:31}

/* Hojas inferiores */
#sheet{position:fixed;inset:0;z-index:50;display:none}
#sheet.open{display:block}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:absolute;left:50%;bottom:0;width:min(100%,520px);transform:translateX(-50%);max-height:92vh;max-height:92dvh;overflow:auto;background:var(--sf);border-radius:24px 24px 0 0;padding:8px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translate(-50%,40px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}#toast{transition:none}}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sh-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sh-h h2{margin:0;font-size:20px;font-weight:700}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:90%;font-size:14px;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body data-acc="personal">
<div class="wrap" id="app"></div>
<div id="sheet"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ============ Constantes ============ */
var KEY='finanzas.v1';
var MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
var MC=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
var LV={basic:1,control:2,planning:3};
var KINDS=['Gastos fijos','Ahorro','Fondo de emergencia','Viaje','Inversión','Otra meta'];
var BLOCKS={obligatorio:'Gastos obligatorios',deudas:'Deudas',metas:'Ahorro y metas',variable:'Gastos variables'};
var PAL=['#2450D6','#E08A1E','#0C6B58','#C43D2C','#7A4FD1','#D14F9A','#3B9AC4','#8A6D3B'];
var SYS=[
  {id:'c_ing',name:'Ingreso',color:'#0E8A5F',block:'ingreso',sys:1},
  {id:'c_sin',name:'Sin categoría',color:'#8A94A3',block:'variable',sys:1},
  {id:'c_deudas',name:'Pago de deudas',color:'#6B4E3D',block:'deudas',sys:1},
  {id:'c_metas',name:'Aporte a metas',color:'#2E9E6B',block:'metas',sys:1},
  {id:'c_prestamo',name:'Préstamo desde meta',color:'#0E8A5F',block:'ingreso',sys:1},
  {id:'c_cuota',name:'Cuota a meta',color:'#2E9E6B',block:'metas',sys:1}
];
var BASE=[
  {id:'c_vivienda',name:'Vivienda y servicios',color:'#2450D6',block:'obligatorio'},
  {id:'c_comida',name:'Alimentación',color:'#E08A1E',block:'obligatorio'},
  {id:'c_transp',name:'Transporte',color:'#0C6B58',block:'obligatorio'},
  {id:'c_salud',name:'Salud',color:'#C43D2C',block:'obligatorio'},
  {id:'c_educ',name:'Educación',color:'#7A4FD1',block:'obligatorio'},
  {id:'c_ocio',name:'Ocio y salidas',color:'#D14F9A',block:'variable'},
  {id:'c_compras',name:'Compras personales',color:'#3B9AC4',block:'variable'},
  {id:'c_otros',name:'Otros',color:'#8A6D3B',block:'variable'}
];
var P={
  home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/>',
  card:'<rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20"/>',
  target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
  cal:'<rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/>',
  chart:'<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>',
  box:'<path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',
  tag:'<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1"/>',
  bag:'<path d="M5 8h14l-1 12H6z"/><path d="M9 8a3 3 0 016 0"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-3.5 3-6 7-6s7 2.5 7 6"/><path d="M16 4.5a3.5 3.5 0 010 7M18 14c2.5.6 4 2.5 4 6"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  swap:'<path d="M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  left:'<path d="M15 5l-7 7 7 7"/>',
  right:'<path d="M9 5l7 7-7 7"/>',
  lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>',
  pie:'<path d="M21 12A9 9 0 1112 3v9z"/><path d="M15 3.5A9 9 0 0120.5 9H15z"/>'
};

/* ============ Utilidades ============ */
function $(s,r){return (r||document).querySelector(s);}
function ic(n,s){return '<svg viewBox="0 0 24 24" width="'+(s||22)+'" height="'+(s||22)+'" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+P[n]+'</svg>';}
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);}
function pad(n){return String(n).padStart(2,'0');}
function today(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function mk(d){return d.slice(0,7);}
function r2(n){return Math.round((n+Number.EPSILON)*100)/100;}
function r4(n){return Math.round((n+Number.EPSILON)*10000)/10000;}
function sum(a,f){return a.reduce(function(s,x){return s+f(x);},0);}
function num(v){var n=parseFloat(String(v==null?'':v).replace(',','.'));return isFinite(n)?n:0;}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function money(n){n=r2(n||0);var neg=n<0;return (neg?'−':'')+'S/ '+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function short(n){n=Math.abs(n);return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1000?(n/1000).toFixed(1)+'k':String(Math.round(n));}
function fmtq(n){return Number.isInteger(n)?String(n):n.toFixed(2);}
function fdate(d){var p=d.split('-');return (+p[2])+' '+MC[+p[1]-1]+(p[0]!==today().slice(0,4)?' '+p[0]:'');}
function addMonth(k,n){var p=k.split('-');var d=new Date(+p[0],+p[1]-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1);}
function mlabel(k){var p=k.split('-');var s=MES[+p[1]-1];return s.charAt(0).toUpperCase()+s.slice(1)+' '+p[0];}
function daysAgo(d){return Math.floor((new Date(today()+'T00:00:00')-new Date(d+'T00:00:00'))/864e5);}
function dueDate(m,day){var p=m.split('-');var last=new Date(+p[0],+p[1],0).getDate();return m+'-'+pad(Math.min(day,last));}
function nextDue(day){var t=today();var d=dueDate(mk(t),day);if(d<t)d=dueDate(addMonth(mk(t),1),day);return d;}

/* ============ Estado y almacenamiento ============ */
var canSave=true;
function defState(){
  return {v:1,plan:'both',level:'basic',
    ui:{account:'personal',tab:{personal:'home',business:'dash'},month:mk(today()),view:null,welcomed:false,mf:'all',bmode:'month',pmode:'month',bsub:'budgets',sub:'cxc'},
    cats:BASE.map(function(c){return Object.assign({},c);}),
    tx:[],debts:[],goals:[],plans:{},transfers:[],
    products:[],contacts:[],purchases:[],sales:[],loans:[],budgets:[],settings:{loanRate:1.5,salesGoal:0}};
}
function norm(s){
  var d=defState();var o=Object.assign(d,s||{});
  var ui=(s&&s.ui)||{};
  o.ui=Object.assign(defState().ui,ui);
  o.ui.tab=Object.assign({personal:'home',business:'dash'},ui.tab||{});
  ['cats','tx','debts','goals','transfers','products','contacts','purchases','sales','loans','budgets'].forEach(function(k){if(!Array.isArray(o[k]))o[k]=[];});
  if(!o.plans||typeof o.plans!=='object')o.plans={};

function pStats(m){
  var inc=0,out=0,cat=0,byCat={};
  S.tx.forEach(function(t){
    if(t.date.indexOf(m)!==0||t.internal)return;
    if(t.type==='in')inc+=t.amount;
    else{out+=t.amount-(t.goalTaken||0);cat+=t.amount;byCat[t.cat]=(byCat[t.cat]||0)+t.amount;}
  });

}

}
function bCash(){

  S.purchases.forEach(function(p){c-=p.paid;});

function bStats(m){

function payDebt(d,amt,date){

function goal(id){return S.goals.filter(function(g){return g.id===id;})[0];}
function loan(id){return S.loans.filter(function(l){return l.id===id;})[0];}
function loanActive(l){return l.pays.length<l.n;}
function loanOwed(l){return r2(l.principal-sum(l.pays,function(p){return p.principal;}));}
function goalLoaned(g){return r2(sum(S.loans.filter(function(l){return l.goal===g.id;}),loanOwed));}
function goalYield(g){return r2(sum(S.loans.filter(function(l){return l.goal===g.id;}),function(l){return sum(l.pays,function(p){return p.interest;});}));}
function loanPmt(P,n,i){return i>0?P*i/(1-Math.pow(1+i,-n)):P/n;}
/* Sistema francés: cuota fija; el interés de cada mes se calcula sobre el saldo pendiente. */
function loanSchedule(L){
  var i=L.rate/100,pm=r2(loanPmt(L.principal,L.n,i)),bal=L.principal,out=[];
  for(var k=1;k<=L.n;k++){
    var int=r2(bal*i),last=k===L.n;
    var pr=last?bal:r2(pm-int);
    var cu=last?r2(bal+int):pm;
    bal=r2(bal-pr);
    out.push({k:k,date:dueDate(addMonth(mk(L.start),k),+L.start.slice(8)),cuota:cu,interest:int,principal:pr,balance:Math.max(0,bal)});
  }
  return out;
}
function loanPreview(P,n,rate){
  var sc=loanSchedule({principal:P,n:n,rate:rate,start:today()});
  var tot=sum(sc,function(x){return x.cuota;}),int=sum(sc,function(x){return x.interest;});
  return {cuota:sc[0].cuota,interest:r2(int),total:r2(tot)};
}
function createLoan(gid,amount,n,rate,date){
  var G=goal(gid);
  if(!G)return {err:'La meta ya no existe'};
  amount=r2(amount);
  if(!(amount>0))return {err:'Ingresa un monto mayor a 0'};
  if(amount>G.have+0.005)return {err:'La meta solo tiene '+money(G.have)+' disponibles'};
  n=Math.round(n);
  if(!(n>=1&&n<=120))return {err:'Las cuotas deben estar entre 1 y 120'};
  if(!(rate>=0&&rate<=100))return {err:'La tasa mensual debe estar entre 0 y 100'};
  var L={id:uid(),ts:Date.now(),goal:gid,goalName:G.name,principal:amount,n:n,rate:rate,start:date||today(),pays:[]};
  G.have=r2(Math.max(0,G.have-amount));
  S.loans.push(L);
  S.tx.push({id:uid(),ts:Date.now(),date:L.start,type:'in',amount:amount,cat:'c_prestamo',note:'Préstamo desde '+G.name,internal:1,ref:{k:'loandisb',id:L.id}});
  S.settings.loanRate=rate;
  return {loan:L};
}
function payLoanCuota(L,date){
  if(!loanActive(L))return {err:'Este préstamo ya está pagado'};
  var k=L.pays.length+1,row=loanSchedule(L)[k-1],G=goal(L.goal),d=date||today();
  S.tx.push({id:uid(),ts:Date.now(),date:d,type:'out',amount:row.cuota,cat:'c_cuota',note:'Cuota '+k+'/'+L.n+': '+L.goalName,ref:{k:'loan',id:L.id,n:k}});
  if(G)G.have=r2(G.have+row.cuota);
  L.pays.push({k:k,date:d,amount:row.cuota,interest:row.interest,principal:row.principal});
  return {row:row};
}
function cancelLoan(L){
  if(L.pays.length)return false;
  var G=goal(L.goal);if(G)G.have=r2(G.have+L.principal);
  S.tx=S.tx.filter(function(t){return !(t.ref&&t.ref.k==='loandisb'&&t.ref.id===L.id);});
  S.loans=S.loans.filter(function(x){return x.id!==L.id;});
  return true;
}
/* Base para calcular porcentajes: plan del mes, ingresos reales del mes o promedio reciente. */
function incomeBase(m){
  var pl=S.plans[m];

  var real=pStats(m).inc;
  if(real>0)return {v:real,src:'ingresos reales del mes'};
  var tot=0,c=0,i;
  for(i=1;i<=3;i++){var x=pStats(addMonth(m,-i)).inc;if(x>0){tot+=x;c++;}}
  if(c)return {v:r2(tot/c),src:'promedio de tus ingresos recientes'};
  return {v:0,src:'sin ingresos registrados'};
}

/* Registra un egreso. Si el presupuesto está enlazado a una meta, esa parte sale de la meta y no del disponible. */
function addExpense(o){
  var a=r2(o.amount),b=o.budget?budget(o.budget):null,gt=0,gid='';
  if(b&&b.goal){
    var G=goal(b.goal);
    if(G){gt=r2(Math.min(a,Math.max(0,G.have)));if(gt>0){G.have=r2(G.have-gt);gid=G.id;}}
  }
  var t={id:uid(),ts:Date.now(),date:o.date||today(),type:'out',amount:a,cat:o.cat||'c_sin',note:o.note||''};
  if(b)t.budget=b.id;
  if(gt>0){t.goalTaken=gt;t.goalId=gid;}
  S.tx.push(t);
  return {tx:t,goalTaken:gt};
}
function txLocked(t){
  if(!t.ref)return '';
  if(t.ref.k==='loandisb')return 'Este ingreso viene de un préstamo desde una meta. Para deshacerlo, cancela el préstamo en la pestaña Metas.';
  if(t.ref.k==='loan'){var L=loan(t.ref.id);if(L&&t.ref.n!==L.pays.length)return 'Solo puedes eliminar la última cuota pagada de este préstamo.';}
  return '';
}
function delTx(id){
  var t=S.tx.filter(function(x){return x.id===id;})[0];
  if(!t||txLocked(t))return;
  if(t.goalTaken){var gg=goal(t.goalId);if(gg)gg.have=r2(gg.have+t.goalTaken);}
  if(t.ref){
    if(t.ref.k==='debt'){var d=S.debts.filter(function(x){return x.id===t.ref.id;})[0];if(d)d.balance=r2(d.balance+t.amount);}
    if(t.ref.k==='goal'){var g=goal(t.ref.id);if(g)g.have=r2(Math.max(0,g.have-t.amount));}
    if(t.ref.k==='loan'){
      var L=loan(t.ref.id);
      if(L){L.pays=L.pays.filter(function(p){return p.k!==t.ref.n;});var g2=goal(L.goal);if(g2)g2.have=r2(Math.max(0,g2.have-t.amount));}
    }
  }
  S.tx=S.tx.filter(function(x){return x.id!==id;});
}
/* Crea una venta o compra. Devuelve {err} o {rec}. Actualiza inventario y costo promedio. */
function createTrade(kind,o){
  var sale=kind==='sale';
  var ls=o.lines.filter(function(l){return l.qty>0;});
  if(!ls.length)return {err:'Agrega al menos un producto con cantidad mayor a 0'};
  for(var i=0;i<ls.length;i++){
    if(!prod(ls[i].pid))return {err:'Uno de los productos ya no existe'};
    if(!(ls[i].val>=0))return {err:'Revisa los precios ingresados'};
  }
  if(sale){
    var need={};
    ls.forEach(function(l){need[l.pid]=(need[l.pid]||0)+l.qty;});
    for(var pid in need){
      var p0=prod(pid);
      if(p0.stock<need[pid]-1e-9)return {err:'Stock insuficiente de '+p0.name+': hay '+fmtq(p0.stock)};
    }
  }
  var total=r2(sum(ls,function(l){return l.qty*l.val;}));
  if(!(total>0))return {err:'El total debe ser mayor a 0'};
  var mode=o.mode||'cash';
  var paid=mode==='cash'?total:mode==='credit'?0:Math.min(total,r2(Math.max(0,o.paid||0)));
  var name=(o.newParty||'').trim();
  var partyId=o.partyId||'';
  if(paid<total-0.004&&!partyId&&!name)return {err:'Elige o escribe '+(sale?'un cliente':'un proveedor')+' para dejar saldo pendiente'};
  if(name){
    var c={id:uid(),ts:Date.now(),type:sale?'client':'supplier',name:name,phone:''};
    S.contacts.push(c);partyId=c.id;
  }
  var party=partyId?contact(partyId):null;
  var items=[],cogs=0;
  ls.forEach(function(l){
    var p=prod(l.pid);
    if(sale){
      items.push({pid:p.id,name:p.name,qty:l.qty,price:l.val,cost:p.cost});
      cogs+=l.qty*p.cost;
      p.stock=r4(p.stock-l.qty);
    }else{
      items.push({pid:p.id,name:p.name,qty:l.qty,cost:l.val});
      var ns=p.stock+l.qty;
      p.cost=ns>0?r4((p.stock*p.cost+l.qty*l.val)/ns):l.val;
      p.stock=r4(ns);
    }
  });
  var rec={id:uid(),ts:Date.now(),date:o.date||today(),party:partyId,partyName:party?party.name:(sale?'Mostrador':'Sin proveedor'),items:items,total:total,paid:paid,pays:[]};
  if(sale)rec.cogs=r2(cogs);
  if(paid>0)rec.pays.push({id:uid(),ts:Date.now(),date:rec.date,amount:paid});
  (sale?S.sales:S.purchases).push(rec);
  return {rec:rec};
}
function voidTrade(kind,id){
  var sale=kind==='sale';
  var arr=sale?S.sales:S.purchases;
  var r=arr.filter(function(x){return x.id===id;})[0];
  if(!r)return false;
  if(sale){
    r.items.forEach(function(i){var p=prod(i.pid);if(p)p.stock=r4(p.stock+i.qty);});
  }else{
    r.items.forEach(function(it){var p=prod(it.pid);if(p)p.stock=r4(Math.max(0,p.stock-it.qty));});
  }
  if(sale)S.sales=S.sales.filter(function(x){return x.id!==id;});else S.purchases=S.purchases.filter(function(x){return x.id!==id;});
  return true;
}

function tradeStatus(kind,r){
  var sale=kind==='sale';
  if(r2(r.total-r.paid)<=0.004)return {t:sale?'Cobrado':'Pagado',c:'pos'};
  return r.paid>0.004?{t:'Parcial',c:'warn'}:{t:'A crédito',c:'warn'};
}
function findTrade(kind,id){return (kind==='sale'?S.sales:S.purchases).filter(function(x){return x.id===id;})[0];}
function settleTrade(kind,id){
  var r=findTrade(kind,id);
  if(!r)return false;
  var pend=r2(r.total-r.paid);
  if(pend<=0.004)return false;
  r.pays.push({id:uid(),ts:Date.now(),date:today(),amount:pend});
  r.paid=r2(r.paid+pend);
  return true;
}
function removePay(kind,id,pid){
  var r=findTrade(kind,id);
  if(!r)return;
  r.pays=r.pays.filter(function(x){return x.id!==pid;});
  r.paid=r2(sum(r.pays,function(x){return x.amount;}));
}

function barChart(pts,s1,s2,desc){
  var n=pts.length,gw=300/n,bw=Math.min(14,gw/2-2);
  var mx=Math.max(1,Math.max.apply(null,pts.map(function(d){return Math.max(d.a,d.b,0);})));
  var g=pts.map(function(d,i){
    var cx=i*gw+gw/2,ha=Math.max(d.a,0)/mx*88,hb=Math.max(d.b,0)/mx*88;
    return '<rect class="'+s1[1]+'" x="'+(cx-bw-1).toFixed(1)+'" y="'+(100-ha).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+ha.toFixed(1)+'" rx="2"/>'+
      '<rect class="'+s2[1]+'" x="'+(cx+1).toFixed(1)+'" y="'+(100-hb).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hb.toFixed(1)+'" rx="2"/>'+
      '<text x="'+cx.toFixed(1)+'" y="114">'+d.l+'</text>';
  }).join('');
  return '<svg class="bars" viewBox="0 0 300 120" role="img" aria-label="'+esc(s1[0]+' y '+s2[0]+' '+(desc||''))+'">'+g+'</svg>'+
    '<div class="key"><span><i class="k-'+s1[1]+'"></i>'+s1[0]+'</span><span><i class="k-'+s2[1]+'"></i>'+s2[0]+'</span></div>';
}
function buysByProduct(p){
  var mp={};
  S.purchases.filter(function(r){return r.date.indexOf(p)===0;}).forEach(function(r){
    r.items.forEach(function(i){var o=mp[i.pid]||(mp[i.pid]={name:i.name,v:0});o.v+=i.qty*i.cost;});
  });
  return Object.keys(mp).map(function(k){return mp[k];}).sort(function(a,b){return b.v-a.v;});
}

/* ============ Hojas inferiores ============ */
function openSheet(title,body,onSubmit,mount){
  closeSheet();
  var r=$('#sheet');
  r.innerHTML='<div class="scrim" data-a="close"></div><form class="sheet" novalidate role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><div class="grab"></div><div class="sh-h"><h2>'+esc(title)+'</h2><button type="button" class="ib" data-a="close" aria-label="Cerrar">'+ic('x')+'</button></div><div>'+body+'</div></form>';
  r.classList.add('open');
  document.body.classList.add('lock');
  var f=$('form',r);
  f.addEventListener('submit',function(e){
    e.preventDefault();
    if(!onSubmit)return;
    var ok=onSubmit(new FormData(f),f);
    if(ok!==false)closeSheet();
  });
  if(mount)mount(f);
  setTimeout(function(){var a=$('[autofocus]',f);if(a&&a.focus)a.focus();},60);
}
function closeSheet(){
  var r=$('#sheet');
  if(!r)return;
  r.classList.remove('open');r.innerHTML='';
  document.body.classList.remove('lock');
}
function armBtn(btn,fn,label){
  if(!btn)return;
  var t;
  btn.addEventListener('click',function(){
    if(btn.dataset.armed){clearTimeout(t);fn();return;}
    btn.dataset.armed='1';
    var old=btn.innerHTML;
    btn.textContent=label||'Toca otra vez para confirmar';
    t=setTimeout(function(){delete btn.dataset.armed;btn.innerHTML=old;},3500);
  });
}

    var t=fd.get('type')==='in'?'in':'out',date=fd.get('date')||today(),note=String(fd.get('note')||'').trim();

function sheetPlan(){

  function fld(n,l){return '<label class="fld"><span>'+l+'</span><input name="'+n+'" inputmode="decimal" value="'+(pl[n]||'')+'" placeholder="0.00"></label>';}
  var body='<p class="neu">Distribuye tus ingresos previstos de '+MES[+m.slice(5)-1]+' entre estos bloques.</p>'+
    fld('income','Ingresos previstos (S/)')+'<h4>Distribución</h4>'+
    fld('obligatorio','Gastos obligatorios')+fld('deudas','Deudas')+fld('metas','Ahorro y metas')+fld('variable','Gastos variables')+
    '<div class="tot"><span>Sin asignar</span><b id="rest">'+money(0)+'</b></div>'+
    '<button type="button" class="btn block" id="auto">Autocompletar deudas y metas</button>'+
    '<button class="btn primary" style="margin-top:10px">Guardar plan</button>';
  openSheet('Plan de '+MES[+m.slice(5)-1],body,function(fd){
    var o={};['income','obligatorio','deudas','metas','variable'].forEach(function(k){o[k]=r2(Math.max(0,num(fd.get(k))));});
    if(!(o.income>0))return fail('Ingresa tus ingresos previstos');
    S.plans[m]=o;
    commit('Plan guardado');
  },function(f){
    function calc(){
      var v=function(n){return num($('[name='+n+']',f).value);};
      var rest=v('income')-v('obligatorio')-v('deudas')-v('metas')-v('variable');
      var el=$('#rest',f);el.textContent=money(rest);el.className=rest<-0.004?'neg':'';
    }
    f.addEventListener('input',calc);calc();
    $('#auto',f).addEventListener('click',function(){
      var inc=num($('[name=income]',f).value)||incomeBase(m).v;
      $('[name=deudas]',f).value=r2(sum(S.debts.filter(function(d){return d.balance>0.005;}),function(d){return Math.min(d.fee||0,d.balance);}));
      $('[name=metas]',f).value=r2(sum(S.goals.filter(function(g){return g.need-g.have>0.005;}),function(g){return g.mode==='percent'?(g.pct||0)*inc/100:(g.monthly||0);})+sum(S.loans.filter(loanActive),function(l){return loanSchedule(l)[l.pays.length].cuota;}));
      calc();
    });
  });
}

function sheetTrade(kind){

  var lines=[{pid:first.id,qty:1,val:sale?first.price:first.cost}];

  var body='<label class="fld"><span>'+(sale?'Cliente':'Proveedor')+'</span><select name="party"><option value="">'+(sale?'Sin cliente (mostrador)':'Sin proveedor')+'</option>'+parties.map(function(c){return '<option value="'+c.id+'">'+esc(c.name)+'</option>';}).join('')+'</select></label>'+
    '<label class="fld"><span>O escribe uno nuevo</span><input name="newparty" placeholder="Nombre" autocomplete="off"></label>'+

    '<div class="fld"><span>'+(sale?'Cobro':'Pago')+'</span><div class="chips">'+
      '<label class="chip"><input type="radio" name="mode" value="cash" checked><span>Al contado</span></label>'+
      '<label class="chip"><input type="radio" name="mode" value="credit"><span>A crédito</span></label>'+
      '<label class="chip"><input type="radio" name="mode" value="partial"><span>Parcial</span></label></div></div>'+
    '<label class="fld" id="paidw" hidden><span>Monto '+(sale?'cobrado':'pagado')+' ahora (S/)</span><input name="paid" inputmode="decimal" placeholder="0.00"></label>'+
    '<label class="fld"><span>Fecha</span><input type="date" name="date" value="'+today()+'"></label>'+
    '<button class="btn primary">Registrar '+(sale?'venta':'compra')+'</button>';
  openSheet(sale?'Nueva venta':'Nueva compra',body,function(fd){
    var res=createTrade(kind,{date:fd.get('date')||today(),partyId:fd.get('party')||'',newParty:fd.get('newparty')||'',lines:lines,mode:fd.get('mode'),paid:num(fd.get('paid'))});
    if(res.err)return fail(res.err);
    commit(sale?'Venta registrada. Utilidad '+money(res.rec.total-res.rec.cogs):'Compra registrada. Inventario actualizado');
  },function(f){
    var linesEl=$('#lines',f);
    function totals(){
      var t=sum(lines,function(l){return l.qty*l.val;});
      $('#tot',f).textContent=money(t);
      if(sale){
        var u=sum(lines,function(l){var p=prod(l.pid);return p?l.qty*(l.val-p.cost):0;});
        $('#prof',f).textContent='Utilidad estimada '+money(u);
      }
    }
    function draw(){
      linesEl.innerHTML=lines.map(function(l,i){
        return '<div class="ln" data-i="'+i+'"><select data-f="pid" aria-label="Producto">'+S.products.map(function(p){return '<option value="'+p.id+'" '+(p.id===l.pid?'selected':'')+'>'+esc(p.name)+(sale?' (stock '+fmtq(p.stock)+')':'')+'</option>';}).join('')+'</select>'+
          '<label class="mini"><small>Cantidad</small><input data-f="qty" inputmode="decimal" value="'+l.qty+'"></label>'+
          '<label class="mini"><small>'+(sale?'Precio unit.':'Costo unit.')+'</small><input data-f="val" inputmode="decimal" value="'+l.val+'"></label>'+
          (lines.length>1?'<button type="button" class="ib" data-f="rm" aria-label="Quitar producto">'+ic('x',16)+'</button>':'')+'</div>';
      }).join('');
      totals();
    }
    f.addEventListener('input',function(e){
      var ln=e.target.closest?e.target.closest('.ln'):null;
      if(!ln)return;
      var i=+ln.dataset.i,fl=e.target.dataset.f;
      if(fl==='qty')lines[i].qty=num(e.target.value);
      if(fl==='val')lines[i].val=num(e.target.value);
      totals();
    });
    f.addEventListener('change',function(e){
      var ln=e.target.closest?e.target.closest('.ln'):null;
      if(ln&&e.target.dataset.f==='pid'){
        var i=+ln.dataset.i,p=prod(e.target.value);
        lines[i].pid=e.target.value;lines[i].val=p?(sale?p.price:p.cost):0;
        draw();
      }
      if(e.target.name==='mode')$('#paidw',f).hidden=e.target.value!=='partial';
    });
    f.addEventListener('click',function(e){
      var rm=e.target.closest?e.target.closest('[data-f=rm]'):null;
      if(rm){var i=+rm.closest('.ln').dataset.i;lines.splice(i,1);draw();}
    });
    $('#addline',f).addEventListener('click',function(){
      var p=S.products[0];lines.push({pid:p.id,qty:1,val:sale?p.price:p.cost});draw();
    });
    draw();
  });
}

function sheetPay(kind,id){

  var pend=r2(r.total-r.paid);

  var body='<p class="neu">'+esc(r.partyName)+' — pendiente <b>'+money(pend)+'</b></p>'+
    '<label class="fld"><span>Monto (S/)</span><input class="bigin" name="amount" inputmode="decimal" value="'+pend+'" autofocus></label>'+
    '<label class="fld"><span>Fecha</span><input type="date" name="date" value="'+today()+'"></label>'+
    '<button class="btn primary">'+(sale?'Registrar cobro':'Registrar pago')+'</button>';
  openSheet(sale?'Cobro':'Pago',body,function(fd){
    var a=r2(num(fd.get('amount')));

    commit(sale?'Cobro registrado':'Pago registrado');
  });
}

function pHome(){
  var mode=S.ui.pmode==='year'?'year':'month';
  var cur=S.ui.month,p=mode==='year'?cur.slice(0,4):cur,st=pStats(p);
  var bal=r2(st.inc-st.out),rate=st.inc>0?Math.round(bal/st.inc*100):0;
  var h=modeTabs('pmode',mode)+(mode==='year'?yearNav():monthNav());
  h+=hero('Balance '+(mode==='year'?'del año '+p:'de '+MES[+cur.slice(5)-1]),money(bal),[['Ingresos',money(st.inc)],['Egresos',money(st.out)]]);
  h+='<div class="grid"><div class="stat"><small>Disponible hoy</small><b>'+money(pBalance())+'</b></div><div class="stat"><small>Te queda de tus ingresos</small><b class="'+(rate<0?'neg':'pos')+'">'+rate+'%</b></div></div>';
  var pts=[],i;
  if(mode==='year'){for(i=1;i<=12;i++){var s1=pStats(p+'-'+pad(i));pts.push({l:MC[i-1],a:s1.inc,b:s1.out});}}
  else{for(i=5;i>=0;i--){var k2=addMonth(cur,-i),s2=pStats(k2);pts.push({l:MC[+k2.slice(5)-1],a:s2.inc,b:s2.out});}}
  h+='<div class="card"><h3>Ingresos y egresos '+(mode==='year'?'por mes':'de los últimos 6 meses')+'</h3>'+barChart(pts,['Ingresos','bp'],['Egresos','bn'],'')+'</div>';
  if(lvl()>=2){
    var ent=Object.keys(st.byCat).map(function(k){return [k,st.byCat[k]];}).sort(function(a,b){return b[1]-a[1];});
    if(ent.length){
      var items=ent.map(function(e){var c=catOf(e[0]);return {v:e[1],color:c.color,name:c.name};});
      h+='<div class="card"><h3>En qué gasto más</h3><p>Lo que más gastas es <b>'+esc(items[0].name)+'</b>, el '+Math.round(items[0].v/st.catTotal*100)+'% de tus egresos.</p><div class="dn">'+donut(items,st.catTotal)+legend(items,st.catTotal)+'</div></div>';
    }else h+=empty('Aún no hay gastos en este periodo','Cuando registres egresos verás aquí en qué se va tu dinero.');
  }
  if(lvl()>=3){

function debtStatus(d){

    S=norm(keep);S.ui.welcomed=true;S.ui.view='settings';commit('Datos borrados');
  }
};
